server.address=0.0.0.0
server.port=${PORT:10000}
server.servlet.session.cookie.secure=true
spring.datasource.hikari.maximum-pool-size=2
spring.datasource.hikari.minimum-idle=0
spring.datasource.hikari.idle-timeout=60000
spring.datasource.hikari.keepalive-time=0
spring.datasource.hikari.connection-timeout=30000
# Let a serverless database idle between batches; notifications may be delayed.
fundingguard.outbox.delay-ms=${OUTBOX_DELAY_MS:600000}
fundingguard.outbox.initial-delay-ms=${OUTBOX_INITIAL_DELAY_MS:600000}
