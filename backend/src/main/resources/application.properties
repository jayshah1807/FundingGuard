spring.application.name=FundingGuard
server.port=${PORT:8088}
server.address=${BIND_ADDRESS:127.0.0.1}
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://127.0.0.1:55438/fundingguard}
spring.datasource.username=${DATABASE_USER:fundingguard}
spring.datasource.password=${DATABASE_PASSWORD:}
spring.datasource.hikari.maximum-pool-size=10
spring.flyway.enabled=true
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=strict
server.servlet.session.cookie.secure=${COOKIE_SECURE:false}
server.error.include-message=never
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.deserialization.fail-on-unknown-properties=true
spring.servlet.multipart.max-file-size=1MB
spring.servlet.multipart.max-request-size=1MB
fundingguard.seed=${SEED_DEMO:false}
fundingguard.demo-password=${DEMO_PASSWORD:}
logging.level.org.springframework.security=WARN
fundingguard.ingest.keys=${INGEST_KEYS_JSON:{}}
